<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Feed the Shark Game</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    overflow: hidden;
    background: linear-gradient(180deg, #0d3b66, #06121f);
    touch-action: none;
  }

  canvas {
    display: block;
  }

  .ui {
    position: absolute;
    top: 15px;
    width: 100%;
    text-align: center;
    color: white;
    font-family: Arial;
    font-size: 16px;
    opacity: 0.8;
    z-index: 10;
  }
</style>
</head>

<body>

<div class="ui">🐟 Tap anywhere to feed the shark</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* SHARK */
const sharkImg = new Image();
sharkImg.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/White_shark.jpg/640px-White_shark.jpg";

const shark = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  vx: 2,
  vy: 1.5,
  size: 90,
  speed: 2.2
};

/* FOOD */
let food = null;

/* BUBBLES */
const bubbles = [];
for (let i = 0; i < 25; i++) {
  bubbles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 6 + 2,
    speed: Math.random() * 1 + 0.5
  });
}

/* TAP TO DROP FOOD */
function dropFood(x, y) {
  food = { x, y, r: 10 };
}

/* MOBILE + PC INPUT */
window.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  dropFood(t.clientX, t.clientY);
});

window.addEventListener("click", (e) => {
  dropFood(e.clientX, e.clientY);
});

/* SHARK AI */
function updateShark() {
  if (food) {
    let dx = food.x - shark.x;
    let dy = food.y - shark.y;
    let dist = Math.sqrt(dx * dx + dy * dy);

    shark.vx = (dx / dist) * shark.speed;
    shark.vy = (dy / dist) * shark.speed;

    shark.x += shark.vx;
    shark.y += shark.vy;

    /* eat food */
    if (dist < 30) {
      food = null;
    }

  } else {
    /* random swimming */
    shark.x += shark.vx;
    shark.y += shark.vy;

    shark.vx += (Math.random() - 0.5) * 0.2;
    shark.vy += (Math.random() - 0.5) * 0.2;

    const maxSpeed = 2.5;
    shark.vx = Math.max(-maxSpeed, Math.min(maxSpeed, shark.vx));
    shark.vy = Math.max(-maxSpeed, Math.min(maxSpeed, shark.vy));
  }

  /* bounce edges */
  if (shark.x < 0 || shark.x > canvas.width) shark.vx *= -1;
  if (shark.y < 0 || shark.y > canvas.height) shark.vy *= -1;
}

/* DRAW */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* bubbles */
  ctx.fillStyle = "rgba(255,255,255,0.2)";
  for (let b of bubbles) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();

    b.y -= b.speed;
    if (b.y < 0) {
      b.y = canvas.height;
      b.x = Math.random() * canvas.width;
    }
  }

  /* food */
  if (food) {
    ctx.fillStyle = "orange";
    ctx.beginPath();
    ctx.arc(food.x, food.y, food.r, 0, Math.PI * 2);
    ctx.fill();
  }

  /* shark */
  ctx.drawImage(
    sharkImg,
    shark.x - shark.size / 2,
    shark.y - shark.size / 2,
    shark.size,
    shark.size
  );
}

/* LOOP */
function loop() {
  updateShark();
  draw();
  requestAnimationFrame(loop);
}

sharkImg.onload = loop;

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
