<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Feed the Shark</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #0b3a5a, #06121f);
    touch-action: none;
  }

  canvas {
    display: block;
  }

  .ui {
    position: absolute;
    top: 15px;
    width: 100%;
    text-align: center;
    color: white;
    font-family: Arial;
    opacity: 0.85;
    z-index: 10;
  }
</style>
</head>

<body>

<div class="ui">🐟 Tap anywhere to feed the shark</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* 🦈 SHARK IMAGE (embedded so it never breaks) */
const sharkImg = new Image();
sharkImg.src =
"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAoAAAAHgCAYAAACX3..."; 
/* (compressed fallback image placeholder - safe load) */

/* If image fails, we still draw shark shape */
let sharkLoaded = false;
sharkImg.onload = () => sharkLoaded = true;

/* SHARK */
const shark = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  vx: 2,
  vy: 1.5,
  size: 100,
  speed: 2.3
};

/* FOOD */
let food = null;

/* TAP / CLICK */
function setFood(x, y) {
  food = { x, y, r: 10 };
}

window.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  setFood(t.clientX, t.clientY);
});

window.addEventListener("click", (e) => {
  setFood(e.clientX, e.clientY);
});

/* SHARK AI */
function update() {
  if (food) {
    let dx = food.x - shark.x;
    let dy = food.y - shark.y;
    let dist = Math.sqrt(dx * dx + dy * dy);

    shark.vx = (dx / dist) * shark.speed;
    shark.vy = (dy / dist) * shark.speed;

    shark.x += shark.vx;
    shark.y += shark.vy;

    if (dist < 25) food = null;

  } else {
    shark.x += shark.vx;
    shark.y += shark.vy;

    shark.vx += (Math.random() - 0.5) * 0.15;
    shark.vy += (Math.random() - 0.5) * 0.15;

    const max = 2.5;
    shark.vx = Math.max(-max, Math.min(max, shark.vx));
    shark.vy = Math.max(-max, Math.min(max, shark.vy));
  }

  /* bounce */
  if (shark.x < 0 || shark.x > canvas.width) shark.vx *= -1;
  if (shark.y < 0 || shark.y > canvas.height) shark.vy *= -1;
}

/* DRAW */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  /* food */
  if (food) {
    ctx.fillStyle = "orange";
    ctx.beginPath();
    ctx.arc(food.x, food.y, food.r, 0, Math.PI * 2);
    ctx.fill();
  }

  /* shark */
  if (sharkLoaded) {
    ctx.drawImage(
      sharkImg,
      shark.x - shark.size / 2,
      shark.y - shark.size / 2,
      shark.size,
      shark.size
    );
  } else {
    /* fallback shark shape */
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(shark.x, shark.y, 40, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* LOOP */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
